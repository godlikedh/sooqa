name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenAPI contract
        run: sh tools/openapi-validate.sh

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sooqa
          POSTGRES_USER: sooqa
          POSTGRES_PASSWORD: sooqa_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sooqa -d sooqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://sooqa:sooqa_dev_only@127.0.0.1:5432/sooqa
        run: |
          cargo test -p sooqa-persistence --tests -- --ignored
          cargo test -p sooqa-api --test ingest -- --ignored
          cargo test -p sooqa-api --test library -- --ignored
          cargo test -p sooqa-worker --test worker -- --ignored
          cargo test -p sooqa-worker --test inspection -- --ignored

  media:
    name: Media integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Run media integration tests
        run: cargo test -p sooqa-media --lib -- --ignored
