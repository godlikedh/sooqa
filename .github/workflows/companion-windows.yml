name: Windows companion

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows companion build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1-windows-companion

      - name: Build Windows companion
        run: cargo build --locked --release -p sooqa-companion

      - name: Check size and prepare release assets
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "target\release\sooqa-companion.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Windows companion executable was not produced: $binary"
          }

          $size = (Get-Item -LiteralPath $binary).Length
          $maxBytes = 10 * 1024 * 1024
          Write-Output "sooqa-companion.exe size: $size bytes"
          if ($size -gt $maxBytes) {
            throw "sooqa-companion.exe exceeds the 10 MiB limit: $size bytes"
          }

          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $assetName = "sooqa-companion-windows-x86_64.exe"
          $assetPath = Join-Path $assetDirectory $assetName
          Copy-Item -LiteralPath $binary -Destination $assetPath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath "$assetPath.sha256" -Encoding ascii -NoNewline

      - name: Upload Windows companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: sooqa-companion-windows-x86_64-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Windows companion release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows companion assets
        uses: actions/download-artifact@v4
        with:
          name: sooqa-companion-windows-x86_64-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "sooqa $GITHUB_REF_NAME" --generate-notes --verify-tag release-assets/sooqa-companion-windows-x86_64.exe release-assets/sooqa-companion-windows-x86_64.exe.sha256
