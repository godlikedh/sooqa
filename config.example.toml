[server]
listen_address = "0.0.0.0:8080"
request_body_limit_bytes = 1048576
request_timeout_seconds = 30

[worker]
poll_interval_seconds = 5
lease_duration_seconds = 60

[media]
work_root = "/var/lib/sooqa/work"
# Free bytes kept available on the shared work volume. Large download,
# normalization, and fingerprint jobs defer until this reserve plus their
# bounded operation budgets for the supported two-worker envelope are
# available.
work_free_space_reserve_bytes = 17179869184
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
ytdlp_path = "yt-dlp"
ytdlp_format = "bestvideo*+bestaudio/best"
# Empty means direct-only. Page-like URLs are sent to yt-dlp only for the
# closed provider families listed here. YouTube subdomains are included;
# TikTok share hosts are limited to vm/vt/m and www. t.co is accepted only
# when the inspected canonical URL is an X/Twitter status.
# ytdlp_allowed_hosts = [
#   "youtube.com", "youtu.be", "tiktok.com", "instagram.com",
#   "x.com", "twitter.com", "t.co",
# ]
# The home Compose deployment overrides this with http://pot-provider:4416.
# ytdlp_pot_provider_url = "http://127.0.0.1:4416"
# Total deadline for one ffmpeg normalization or video-frame extraction.
processing_timeout_seconds = 3600
# Maximum bytes staged from a URL before normalization. This may exceed 2 GB
# because the canonical normalized output has its own lower ceiling.
source_download_max_bytes = 8589934592
# Must remain below Telegram local Bot API's documented 2000 MB upload limit.
normalized_storage_max_bytes = 1900000000

[media.inline_video]
# Bounded Telegram inline-playback target; adaptation never goes below the
# configured quality floor when this target cannot be met. Candidates also
# must remain within media.normalized_storage_max_bytes.
target_max_bytes = 14680064
preferred_crf = 23
maximum_crf = 27
minimum_short_edge = 480

[companion]
listen_address = "127.0.0.1:47831"
backend_url = "http://127.0.0.1:8080"
request_body_limit_bytes = 65536
request_timeout_seconds = 15
# Inject SOOQA_COMPANION_LOCAL_TOKEN and SOOQA_COMPANION_BACKEND_TOKEN.

[database]
url_env = "DATABASE_URL"
max_connections = 20

[telegram]
api_base_url = "https://api.telegram.org"
admin_user_ids = []
poll_timeout_seconds = 30
# Full Telegram storage upload deadline, independent from polling and download stall timeouts.
upload_timeout_seconds = 3600
# Telegram-source download budget; the local Bot API has no download limit.
source_download_max_bytes = 2147483648
# Worker-only absolute root for files returned by a local Bot API server. The
# home Compose deployment supplies /var/lib/telegram-bot-api automatically.
# local_file_root = "/var/lib/telegram-bot-api"
# Private Telegram channel used for durable media storage.
# storage_chat_id = -1001234567890

[observability]
log_format = "json"
log_level = "info"

[secrets]
# Keep this out of committed files in real deployments.
# api_token = "replace-with-a-long-random-secret"

# Keep secrets in the environment rather than committing them to a file.
