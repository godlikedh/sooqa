openapi: 3.0.3
info:
  title: sooqa API
  version: 0.1.0
  description: Authenticated HTTP API for the sooqa media inbox.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
tags:
  - name: ingest
    description: Durable content submissions
  - name: library
    description: Search and editorial Library operations
  - name: duplicate-candidates
    description: Review perceptual duplicate candidates
  - name: publisher
    description: Post drafts and durable publication schedules
paths:
  /api/v1/ingest-requests:
    post:
      tags: [ingest]
      operationId: createIngestRequest
      summary: Submit a URL for ingestion
      description: Creates a durable ingest request and its first inspect_source job.
      security:
        - bearerAuth: []
      x-required-scope: ingest:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestCreateRequest'
      responses:
        '202':
          description: Ingest request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ingest-requests/{id}:
    get:
      tags: [ingest]
      operationId: getIngestRequest
      summary: Get an ingest request
      security:
        - bearerAuth: []
      x-required-scope: ingest:read
      parameters:
        - $ref: '#/components/parameters/IngestRequestId'
      responses:
        '200':
          description: Ingest request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/post-drafts:
    post:
      tags: [publisher]
      operationId: createPostDraft
      summary: Create a publication draft
      description: Creates a draft from an active Library item whose canonical asset is already stored.
      security:
        - bearerAuth: []
      x-required-scope: publisher:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDraftCreateRequest'
      responses:
        '201':
          description: Publication draft created or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/post-drafts/{id}:
    get:
      tags: [publisher]
      operationId: getPostDraft
      summary: Get a publication draft
      security:
        - bearerAuth: []
      x-required-scope: publisher:read
      parameters:
        - $ref: '#/components/parameters/PostDraftId'
      responses:
        '200':
          description: Publication draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [publisher]
      operationId: updatePostDraft
      summary: Edit or ready a publication draft
      security:
        - bearerAuth: []
      x-required-scope: publisher:write
      parameters:
        - $ref: '#/components/parameters/PostDraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDraftUpdateRequest'
      responses:
        '200':
          description: Updated publication draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/post-drafts/{id}/schedule:
    post:
      tags: [publisher]
      operationId: schedulePostDraft
      summary: Schedule a ready publication draft
      security:
        - bearerAuth: []
      x-required-scope: publisher:write
      parameters:
        - $ref: '#/components/parameters/PostDraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationScheduleRequest'
      responses:
        '202':
          description: Durable publication schedule created or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/post-drafts/{id}/publish-now:
    post:
      tags: [publisher]
      operationId: publishPostDraftNow
      summary: Publish a ready draft immediately
      description: Creates a due publication schedule; Telegram delivery is performed by a later worker slice.
      security:
        - bearerAuth: []
      x-required-scope: publisher:write
      parameters:
        - $ref: '#/components/parameters/PostDraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Durable immediate publication schedule created or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/library/items:
    get:
      tags: [library]
      operationId: listLibraryItems
      summary: Search Library items
      security:
        - bearerAuth: []
      x-required-scope: library:read
      parameters:
        - name: q
          in: query
          description: Case-insensitive text search across editorial and source metadata.
          schema:
            type: string
        - name: tags
          in: query
          description: Comma-separated tags; all supplied tags must match.
          schema:
            type: string
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ContentKind'
        - name: status
          in: query
          description: Defaults to active.
          schema:
            type: string
            enum: [active, archived, deleted]
            default: active
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of Library items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/library/items/{id}:
    get:
      tags: [library]
      operationId: getLibraryItem
      summary: Get a Library item
      security:
        - bearerAuth: []
      x-required-scope: library:read
      parameters:
        - $ref: '#/components/parameters/LibraryItemId'
      responses:
        '200':
          description: Library item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [library]
      operationId: updateLibraryItem
      summary: Update Library editorial fields
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/LibraryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryItemUpdateRequest'
      responses:
        '200':
          description: Updated Library item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/library/items/{id}/archive:
    post:
      tags: [library]
      operationId: archiveLibraryItem
      summary: Archive a Library item
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/LibraryItemId'
      responses:
        '200':
          description: Archived Library item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/library/items/{id}/tags:
    post:
      tags: [library]
      operationId: addLibraryItemTag
      summary: Attach a tag to a Library item
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/LibraryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryTagRequest'
      responses:
        '200':
          description: Attached tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/library/items/{id}/tags/{tag}:
    delete:
      tags: [library]
      operationId: removeLibraryItemTag
      summary: Detach a tag from a Library item
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/LibraryItemId'
        - $ref: '#/components/parameters/LibraryTagName'
      responses:
        '204':
          description: Tag detached
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/duplicate-candidates:
    get:
      tags: [duplicate-candidates]
      operationId: listDuplicateCandidates
      summary: List perceptual duplicate candidates
      security:
        - bearerAuth: []
      x-required-scope: library:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed_variant, kept_separate, dismissed]
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Duplicate candidates ordered by score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidateListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/duplicate-candidates/{id}:
    get:
      tags: [duplicate-candidates]
      operationId: getDuplicateCandidate
      summary: Get a duplicate candidate and audit events
      security:
        - bearerAuth: []
      x-required-scope: library:read
      parameters:
        - $ref: '#/components/parameters/DuplicateCandidateId'
      responses:
        '200':
          description: Duplicate candidate detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidateDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/duplicate-candidates/{id}/confirm-variant:
    post:
      tags: [duplicate-candidates]
      operationId: confirmDuplicateVariant
      summary: Confirm a candidate as a variant
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/DuplicateCandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidateDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/duplicate-candidates/{id}/keep-separate:
    post:
      tags: [duplicate-candidates]
      operationId: keepDuplicateCandidatesSeparate
      summary: Keep candidate items separate
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/DuplicateCandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidateDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/duplicate-candidates/{id}/dismiss:
    post:
      tags: [duplicate-candidates]
      operationId: dismissDuplicateCandidate
      summary: Dismiss a duplicate candidate
      security:
        - bearerAuth: []
      x-required-scope: library:write
      parameters:
        - $ref: '#/components/parameters/DuplicateCandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidateDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sooqa-device-token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replays the original operation when the key and request scope match.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IngestRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LibraryItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LibraryTagName:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DuplicateCandidateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostDraftId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Forbidden:
      description: Token lacks the required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Conflict:
      description: The request conflicts with an earlier operation or resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
  schemas:
    PostDraftCreateRequest:
      type: object
      required: [content_item_id, target_channel_id]
      additionalProperties: false
      properties:
        content_item_id:
          type: string
          format: uuid
        target_channel_id:
          type: string
          format: uuid
        caption:
          type: string
          maxLength: 1024
          nullable: true
        parse_mode:
          type: string
          enum: [HTML, MarkdownV2]
          nullable: true
    PostDraftUpdateRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [caption]
        - required: [parse_mode]
        - required: [status]
      properties:
        caption:
          type: string
          maxLength: 1024
          nullable: true
        parse_mode:
          type: string
          enum: [HTML, MarkdownV2]
          nullable: true
        status:
          type: string
          enum: [editing, ready, cancelled]
        expected_updated_at:
          type: string
          format: date-time
          nullable: true
    PostDraft:
      type: object
      required:
        - id
        - content_item_id
        - asset_id
        - target_channel_id
        - caption
        - parse_mode
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        content_item_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        target_channel_id:
          type: string
          format: uuid
        caption:
          type: string
          nullable: true
        parse_mode:
          type: string
          enum: [HTML, MarkdownV2]
          nullable: true
        status:
          type: string
          enum: [editing, ready, scheduled, published, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicationScheduleRequest:
      type: object
      required: [publish_at]
      additionalProperties: false
      properties:
        publish_at:
          type: string
          format: date-time
        not_before:
          type: string
          format: date-time
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          format: int32
          default: 0
        cooldown_override:
          type: boolean
          nullable: true
    PublicationSchedule:
      type: object
      required:
        - id
        - post_draft_id
        - status
        - publish_at
        - not_before
        - not_after
        - priority
        - cooldown_override
        - idempotency_key
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        post_draft_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, queued, publishing, published, failed, unknown, cancelled]
        publish_at:
          type: string
          format: date-time
        not_before:
          type: string
          format: date-time
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          format: int32
        cooldown_override:
          type: boolean
          nullable: true
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DuplicateCandidateListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCandidate'
    DuplicateCandidateDetailResponse:
      type: object
      required: [candidate, events]
      properties:
        candidate:
          $ref: '#/components/schemas/DuplicateCandidate'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCandidateEvent'
    DuplicateCandidate:
      type: object
      required:
        - id
        - left_content_item_id
        - right_content_item_id
        - algorithm_version
        - score_basis_points
        - evidence_json
        - status
        - created_at
        - updated_at
        - resolved_at
      properties:
        id:
          type: string
          format: uuid
        left_content_item_id:
          type: string
          format: uuid
        right_content_item_id:
          type: string
          format: uuid
        algorithm_version:
          type: string
        score_basis_points:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        evidence_json:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, confirmed_variant, kept_separate, dismissed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
    DuplicateCandidateEvent:
      type: object
      required: [id, candidate_id, action, actor_device_token_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [confirm_variant, keep_separate, dismiss]
        actor_device_token_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    LibrarySearchResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySearchItem'
        next_cursor:
          type: string
          nullable: true
    LibrarySearchItem:
      allOf:
        - $ref: '#/components/schemas/LibraryItemFields'
        - type: object
          required: [source_count]
          properties:
            source_count:
              type: integer
              format: int64
              minimum: 0
    LibraryDetailResponse:
      allOf:
        - $ref: '#/components/schemas/LibraryItemFields'
        - type: object
          required: [sources]
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/LibrarySource'
    LibraryItemFields:
      type: object
      required:
        - id
        - kind
        - status
        - preferred_title
        - editorial_description
        - notes
        - canonical_asset
        - tags
        - created_at
        - updated_at
        - archived_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ContentKind'
        status:
          $ref: '#/components/schemas/ContentStatus'
        preferred_title:
          type: string
          nullable: true
        editorial_description:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        canonical_asset:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LibraryAsset'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/LibraryTag'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
    LibraryItemUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        preferred_title:
          type: string
          nullable: true
        editorial_description:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        expected_updated_at:
          type: string
          format: date-time
          nullable: true
    LibraryTagRequest:
      type: object
      required: [tag]
      additionalProperties: false
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 100
    LibraryTag:
      type: object
      required: [id, normalized_name, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        normalized_name:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    LibraryAsset:
      type: object
      required:
        - id
        - role
        - media_kind
        - mime_type
        - container
        - width
        - height
        - duration_ms
        - bit_rate
        - file_size_bytes
        - storage_state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AssetRole'
        media_kind:
          $ref: '#/components/schemas/MediaKind'
        mime_type:
          type: string
          nullable: true
        container:
          type: string
          nullable: true
        width:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        bit_rate:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        file_size_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        storage_state:
          $ref: '#/components/schemas/StorageState'
        created_at:
          type: string
          format: date-time
    LibrarySource:
      type: object
      required:
        - id
        - source_type
        - original_url
        - normalized_url
        - platform
        - platform_content_id
        - author_name
        - source_title
        - source_description
        - source_published_at
        - retrieved_at
        - metadata_json
      properties:
        id:
          type: string
          format: uuid
        source_type:
          $ref: '#/components/schemas/SourceType'
        original_url:
          type: string
          nullable: true
        normalized_url:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
        platform_content_id:
          type: string
          nullable: true
        author_name:
          type: string
          nullable: true
        source_title:
          type: string
          nullable: true
        source_description:
          type: string
          nullable: true
        source_published_at:
          type: string
          format: date-time
          nullable: true
        retrieved_at:
          type: string
          format: date-time
        metadata_json:
          type: object
          additionalProperties: true
    ContentKind:
      type: string
      enum: [video, image, animation, audio]
    ContentStatus:
      type: string
      enum: [active, archived, deleted]
    AssetRole:
      type: string
      enum: [original, canonical, preview, thumbnail]
    MediaKind:
      type: string
      enum: [video, image, audio, animation]
    StorageState:
      type: string
      enum: [local, uploaded, missing]
    SourceType:
      type: string
      enum: [webpage, direct_url, youtube, telegram, upload]
    IngestCreateRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: '^https?://.+'
          description: HTTP or HTTPS source URL.
        page_url:
          type: string
          format: uri
          pattern: '^https?://.+'
        page_title:
          type: string
        selected_text:
          type: string
          description: Optional text selected by the administrator as a caption hint.
        tags:
          type: array
          items:
            type: string
          default: []
    IngestAcceptedResponse:
      type: object
      required: [id, status, links]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/IngestStatus'
        links:
          $ref: '#/components/schemas/IngestLinks'
    IngestResponse:
      type: object
      required:
        - id
        - kind
        - status
        - source_url
        - supplied_tags
        - created_at
        - updated_at
        - links
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/IngestKind'
        status:
          $ref: '#/components/schemas/IngestStatus'
        source_url:
          type: string
          format: uri
          pattern: '^https?://.+'
        page_url:
          type: string
          format: uri
          nullable: true
        page_title:
          type: string
          nullable: true
        supplied_caption:
          type: string
          nullable: true
        supplied_tags:
          type: array
          items:
            type: string
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        links:
          $ref: '#/components/schemas/IngestLinks'
    IngestLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string
    IngestKind:
      type: string
      enum: [url, telegram_message, upload]
    IngestStatus:
      type: string
      enum:
        - received
        - queued
        - downloading
        - probing
        - exact_dedup_check
        - normalizing
        - fingerprinting
        - similarity_check
        - storing
        - completed
        - failed_retryable
        - failed_terminal
        - cancelled
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
