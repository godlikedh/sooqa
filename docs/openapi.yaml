        description: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        storage_state: { type: string, enum: [pending_storage, ready, storage_unknown, missing], nullable: true }
        source_url: { type: string, nullable: true }
        source_metadata: { type: object, additionalProperties: true, nullable: true }
        mime_type: { type: string, nullable: true }
        container: { type: string, nullable: true }
        video_codec: { type: string, nullable: true }
        audio_codec: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_ms: { type: integer, format: int64, nullable: true }
        bit_rate: { type: integer, format: int64, nullable: true }
        file_size_bytes: { type: integer, format: int64, nullable: true }
        sha256: { type: string, nullable: true }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
