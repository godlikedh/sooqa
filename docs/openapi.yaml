openapi: 3.0.3
info:
  title: sooqa API
  version: 0.1.0
  description: Private single-admin HTTP API for the durable sooqa media pipeline.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
tags:
  - name: health
    description: Process liveness.
  - name: ingest
    description: Durable media ingestion requests.
  - name: media
    description: Normalized media catalogue operations.
  - name: channels
    description: Configured Telegram publication targets.
  - name: posts
    description: Intended posts and publication scheduling.
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveHealth
      summary: Check liveness
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: The health request was malformed.
  /api/v1/ingests:
    post:
      tags: [ingest]
      operationId: createIngest
      summary: Submit a URL for durable ingestion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestCreateRequest'
      responses:
        '202':
          description: Ingest accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/ingests/{id}:
    get:
      tags: [ingest]
      operationId: getIngest
      summary: Read ingest progress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IngestId'
      responses:
        '200':
          description: Ingest request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/ingests/{id}/force-save:
    post:
      tags: [ingest]
      operationId: forceSaveIngest
      summary: Override a pending perceptual duplicate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IngestId'
      responses:
        '200':
          description: The force-save request was already resumed or completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '202':
          description: Force-save was accepted and normalization was queued again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/ingests/{id}/accept-duplicate:
    post:
      tags: [ingest]
      operationId: acceptDuplicateIngest
      summary: Accept an evidenced existing media candidate
      description: >-
        Reuses the selected persisted candidate without creating another media
        row or storage upload. The command is replay-safe.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IngestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDuplicateRequest'
      responses:
        '200':
          description: The candidate was accepted, or the same decision was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '202':
          description: The candidate is pending storage and the ingest follows its lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/media:
    get:
      tags: [media]
      operationId: searchMedia
      summary: Search normalized media
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: tags, in: query, description: Comma-separated normalized tags., schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MediaKind' } }
        - name: status
          in: query
          schema:
            allOf:
              - $ref: '#/components/schemas/MediaStatus'
            default: active
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of media rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/media/{id}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [media]
      operationId: getMedia
      summary: Read one normalized media row
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Media row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [media]
      operationId: updateMedia
      summary: Update editorial media fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUpdateRequest' }
      responses:
        '200':
          description: Updated media row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/media/{id}/archive:
    post:
      tags: [media]
      operationId: archiveMedia
      summary: Archive media
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Archived media row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/media/{id}/tags:
    post:
      tags: [media]
      operationId: addMediaTag
      summary: Add a normalized tag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagRequest' }
      responses:
        '200':
          description: The attached tag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/media/{id}/tags/{tag}:
    delete:
      tags: [media]
      operationId: removeMediaTag
      summary: Remove a normalized tag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - { name: tag, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Tag removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: List configured target channels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configured channels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [channels]
      operationId: createChannel
      summary: Register a target channel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCreateRequest' }
      responses:
        '201':
          description: Channel created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/channels/{id}:
    get:
      tags: [channels]
      operationId: getChannel
      summary: Read one target channel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Target channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts:
    post:
      tags: [posts]
      operationId: createPost
      summary: Create an intended post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreateRequest' }
      responses:
        '201':
          description: Post created or replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: getPost
      summary: Read one post
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [posts]
      operationId: updatePost
      summary: Edit a post before publication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostUpdateRequest' }
      responses:
        '200':
          description: Updated post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}/schedule:
    post:
      tags: [posts]
      operationId: schedulePost
      summary: Queue a post for publication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '202':
          description: Post queued and publish job enqueued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}/publish:
    post:
      tags: [posts]
      operationId: publishPostNow
      summary: Queue a post for immediate publication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueMutationRequest' }
      responses:
        '202':
          description: Post queued for immediate publication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}/earlier:
    post:
      tags: [posts]
      operationId: movePostEarlier
      summary: Swap a queued post with its adjacent earlier post
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueMutationRequest' }
      responses:
        '200':
          description: Current post after the swap or boundary no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}/later:
    post:
      tags: [posts]
      operationId: movePostLater
      summary: Swap a queued post with its adjacent later post
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueMutationRequest' }
      responses:
        '200':
          description: Current post after the swap or boundary no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}/slot:
    post:
      tags: [posts]
      operationId: setPostSlot
      summary: Move a queued post to a valid cadence slot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSlotRequest' }
      responses:
        '200':
          description: Current post after moving or swapping the slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/posts/{id}/cancel:
    post:
      tags: [posts]
      operationId: cancelPost
      summary: Cancel a mutable post and its publication job
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueMutationRequest' }
      responses:
        '200':
          description: Cancelled post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sooqa-api-token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    IngestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency or state conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Request body exceeds the configured limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }
    HealthResponse:
      type: object
      required: [status, service, build]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        build:
          type: object
          required: [version, git_sha]
          properties:
            version: { type: string }
            git_sha: { type: string }
    IngestCreateRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        page_url: { type: string, format: uri, nullable: true }
        page_title: { type: string, nullable: true }
        description:
          type: string
          nullable: true
          description: Internal description stored on new media; never treated as public post text.
        selected_text: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
    AcceptDuplicateRequest:
      type: object
      required: [media_id]
      additionalProperties: false
      properties:
        media_id: { type: string, format: uuid }
    IngestAcceptedResponse:
      type: object
      required: [id, status, links]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IngestStatus' }
        links:
          type: object
          required: [self]
          properties:
            self: { type: string }
    IngestResponse:
      allOf:
        - $ref: '#/components/schemas/IngestAcceptedResponse'
        - type: object
          required: [kind, source_url, created_at, updated_at, supplied_tags, force_save]
          properties:
            kind: { type: string, enum: [url, telegram_message, upload] }
            source_url: { type: string }
            page_url: { type: string, nullable: true }
            page_title: { type: string, nullable: true }
            supplied_caption: { type: string, nullable: true }
            supplied_description: { type: string, nullable: true }
            supplied_tags: { type: array, items: { type: string } }
            media_id: { type: string, format: uuid, nullable: true }
            force_save: { type: boolean }
            duplicate_evidence:
              type: object
              allOf:
                - $ref: '#/components/schemas/VideoDuplicateEvidence'
              nullable: true
            error_code: { type: string, nullable: true }
            error_message: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time, nullable: true }
    IngestStatus:
      type: string
      enum: [received, queued, downloading, probing, exact_dedup_check, normalizing, fingerprinting, duplicate_pending, storing, completed, failed_retryable, failed_terminal, cancelled]
    VideoDuplicateEvidence:
      type: object
      required: [algorithm_version, matches]
      properties:
        algorithm_version: { type: string }
        matches:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/VideoDuplicateMatch' }
    VideoDuplicateMatch:
      type: object
      required: [media_id, fingerprint_version, classification, aligned_offset_ms, informative_matched_samples, incoming_coverage_bps, candidate_coverage_bps, median_distance_bps, high_percentile_distance_bps, longest_temporally_consistent_run, unmatched_incoming_prefix, unmatched_incoming_suffix, unmatched_candidate_prefix, unmatched_candidate_suffix, gap_count, score_bps, shared_token_count, token_overlap_bps]
      properties:
        media_id: { type: string, format: uuid }
        fingerprint_version: { type: string }
        classification: { type: string, enum: [strong_duplicate, partial_match] }
        aligned_offset_ms: { type: integer, format: int64 }
        informative_matched_samples: { type: integer, minimum: 0, maximum: 65535 }
        incoming_coverage_bps: { type: integer, minimum: 0, maximum: 10000 }
        candidate_coverage_bps: { type: integer, minimum: 0, maximum: 10000 }
        median_distance_bps: { type: integer, minimum: 0, maximum: 10000 }
        high_percentile_distance_bps: { type: integer, minimum: 0, maximum: 10000 }
        longest_temporally_consistent_run: { type: integer, minimum: 0, maximum: 65535 }
        unmatched_incoming_prefix: { type: integer, minimum: 0, maximum: 65535 }
        unmatched_incoming_suffix: { type: integer, minimum: 0, maximum: 65535 }
        unmatched_candidate_prefix: { type: integer, minimum: 0, maximum: 65535 }
        unmatched_candidate_suffix: { type: integer, minimum: 0, maximum: 65535 }
        gap_count: { type: integer, minimum: 0, maximum: 65535 }
        score_bps: { type: integer, minimum: 0, maximum: 10000 }
        shared_token_count: { type: integer, format: int64, minimum: 0 }
        token_overlap_bps: { type: integer, format: int64, minimum: 0, maximum: 10000 }
    MediaKind:
      type: string
