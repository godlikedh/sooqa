services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sooqa
      POSTGRES_USER: sooqa
      POSTGRES_PASSWORD: sooqa_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sooqa -d sooqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
