[workspace]
resolver = "3"
members = [
    "apps/server",
    "apps/worker",
    "apps/companion",
    "crates/config",
    "crates/runtime",
    "crates/kernel",
    "crates/inbox",
    "crates/library",
    "crates/publisher",
    "crates/jobs",
    "crates/media",
    "crates/telegram",
    "crates/persistence",
    "crates/api",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
async-trait = "0.1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
    "time",
    "uuid",
] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
thiserror = "2"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
